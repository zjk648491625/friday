<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- 整体容器与样式定义 -->
  <defs>
    <!-- 金色面具渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="40%" stop-color="#F5B041" />
      <stop offset="100%" stop-color="#9A6010" />
    </linearGradient>

    <!-- 红色外壳渐变 -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC7063" />
      <stop offset="40%" stop-color="#C0392B" />
      <stop offset="100%" stop-color="#641E16" />
    </linearGradient>

    <!-- 眼睛与额头字母的科技蓝发光渐变 -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#5DADE2" />
    </linearGradient>

    <!-- 阴影滤镜增加立体感 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 钢铁侠头部主体（背景已设为透明） -->
  <g filter="url(#dropShadow)">

    <!-- === 1. 红色外壳/头盔轮廓 === -->
    <!-- 额头至两侧下巴的主轮廓 -->
    <path d="M 160 80
             L 352 80
             L 400 160
             L 410 280
             L 370 380
             L 330 440
             L 256 460
             L 182 440
             L 142 380
             L 102 280
             L 112 160 Z"
          fill="url(#redGrad)" stroke="#4A150F" stroke-width="4" stroke-linejoin="round"/>

    <!-- 耳部装甲夹片（左/右） -->
    <path d="M 112 200 L 95 230 L 95 290 L 105 320 Z" fill="#922B21" stroke="#4A150F" stroke-width="3"/>
    <path d="M 400 200 L 417 230 L 417 290 L 407 320 Z" fill="#922B21" stroke="#4A150F" stroke-width="3"/>

    <!-- === 2. 金色面具部分 === -->
    <!-- 面具主基底 -->
    <path d="M 165 150
             L 347 150
             L 375 220
             L 370 340
             L 320 420
             L 256 425
             L 192 420
             L 142 340
             L 137 220 Z"
          fill="url(#goldGrad)" stroke="#5E3907" stroke-width="3" stroke-linejoin="round"/>

    <!-- 额头V形切口（呈现钢铁侠经典的机械分件感） -->
    <path d="M 190 150 L 256 200 L 322 150" fill="none" stroke="#641E16" stroke-width="4" stroke-linejoin="round"/>

    <!-- 脸颊内凹结构线（提升机械立体感） -->
    <path d="M 137 240 L 190 270 L 190 340 L 160 380" fill="none" stroke="#7E5109" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 375 240 L 322 270 L 322 340 L 352 380" fill="none" stroke="#7E5109" stroke-width="3" stroke-linejoin="round"/>

    <!-- 下巴中轴线与结构线 -->
    <line x1="256" y1="370" x2="256" y2="425" stroke="#5E3907" stroke-width="2"/>
    <path d="M 220 370 L 256 375 L 292 370 L 310 415 L 202 415 Z" fill="#B7950B" opacity="0.5"/>

    <!-- === 3. 眼睛（发光蓝） === -->
    <!-- 左眼（怒视形态经典微倾斜平行四边形） -->
    <polygon points="165,245 225,250 215,268 170,265" fill="url(#glowGrad)" stroke="#2874A6" stroke-width="2" filter="url(#eyeGlow)"/>
    <!-- 右眼 -->
    <polygon points="347,245 287,250 297,268 342,265" fill="url(#glowGrad)" stroke="#2874A6" stroke-width="2" filter="url(#eyeGlow)"/>

    <!-- === 4. 嘴部线条 === -->
    <path d="M 200 340 L 256 345 L 312 340 L 305 350 L 256 355 L 207 350 Z" fill="#5E3907"/>

    <!-- === 5. 额头核心标记：大写字母 “F” === -->
    <!-- 采用硬朗、粗壮的科幻机甲风字体，自带科技蓝强发光效果 -->
    <g filter="url(#eyeGlow)">
      <path d="M 230 95
               L 285 95
               L 285 110
               L 248 110
               L 248 123
               L 278 123
               L 278 138
               L 248 138
               L 248 165
               L 230 165 Z"
            fill="url(#glowGrad)"
            stroke="#21618C"
            stroke-width="1.5"
            stroke-linejoin="miter"/>
    </g>

  </g>
</svg>
