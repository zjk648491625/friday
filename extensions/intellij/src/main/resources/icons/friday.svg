<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <!-- 全息科技蓝渐变：确保小尺寸下依然有立体感 -->
    <linearGradient id="ideaCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00838F" />
    </linearGradient>

    <!-- 眼睛和核心字符的高亮霓虹白蓝 -->
    <linearGradient id="coreWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </linearGradient>
  </defs>

  <!-- 背景透明，直接进入核心图层 -->
  <g>
    <!-- === 1. 外部机甲头盔剪影 (加粗边框以防在暗色主题下看不清) === -->
    <path d="M 12 5
             L 28 5
             L 32 12
             L 33 22
             L 30 30
             L 26 35
             L 20 37
             L 14 35
             L 10 30
             L 7 22
             L 8 12 Z"
          fill="#002D32"
          fill-opacity="0.6"
          stroke="url(#ideaCyan)"
          stroke-width="1.5"
          stroke-linejoin="round"/>

    <!-- === 2. 内部面具内嵌结构线 === -->
    <path d="M 12 11 L 28 11 L 30 16 L 29 27 L 25 33 L 20 34 L 15 33 L 10 27 L 9 16 Z"
          fill="none"
          stroke="#00E5FF"
          stroke-width="1"
          stroke-linejoin="round"
          opacity="0.4"/>

    <!-- 额头倒 V 型切割线 -->
    <path d="M 14 11 L 20 15 L 26 11" fill="none" stroke="#00E5FF" stroke-width="0.75" opacity="0.6"/>

    <!-- === 3. 高亮量子双眼（标准几何硬切角，小尺寸下极度锐利） === -->
    <!-- 左眼 -->
    <polygon points="12.5,19 17.5,19.5 16.5,21 13,20.5" fill="url(#coreWhite)" stroke="#00838F" stroke-width="0.5"/>
    <!-- 右眼 -->
    <polygon points="27.5,19 22.5,19.5 23.5,21 27,20.5" fill="url(#coreWhite)" stroke="#00838F" stroke-width="0.5"/>

    <!-- === 4. 核心优化：额头极简赛博风格“五”字标记 === -->
    <!-- 优化了笔画粗细，采用像素对齐结构，在小屏幕上绝不模糊 -->
    <g>
      <!-- 第一横 -->
      <line x1="16" y1="7.5" x2="24" y2="7.5" stroke="url(#coreWhite)" stroke-width="1.2" stroke-linecap="square"/>
      <!-- 第二横（内横） -->
      <line x1="17.5" y1="9" x2="22.5" y2="9" stroke="url(#coreWhite)" stroke-width="0.8" stroke-linecap="square"/>
      <!-- 左侧斜折 -->
      <path d="M 20 9 L 18.5 12" fill="none" stroke="url(#coreWhite)" stroke-width="1" stroke-linecap="square"/>
      <!-- 右侧向下一竖 -->
      <line x1="21.5" y1="9" x2="21.5" y2="12" stroke="url(#coreWhite)" stroke-width="1" stroke-linecap="square"/>
      <!-- 最底下一大横 -->
      <line x1="16" y1="12" x2="24" y2="12" stroke="url(#coreWhite)" stroke-width="1.2" stroke-linecap="square"/>
    </g>

    <!-- === 5. 下颚机械轴线 === -->
    <line x1="20" y1="30" x2="20" y2="34" stroke="#00E5FF" stroke-width="0.75" opacity="0.5"/>
  </g>
</svg>
