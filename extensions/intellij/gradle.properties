pluginGroup=com.github.friday-ai.fridayintellijextension
pluginVersion=0.0.1
platformVersion=2025.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.java.home=C\:\\soft\\Java\\jdk-17

# ---------------------------------------------------------------------------
# Gradle user home (GRADLE_USER_HOME)
#
# Location of Gradle's own caches, wrapper distributions and downloaded
# dependencies. Falls back to ~/.gradle when unset.
#
#   GRADLE_USER_HOME=D:/soft/gradle-home
# ---------------------------------------------------------------------------
# GRADLE_USER_HOME=

# ---------------------------------------------------------------------------
# Local Maven repository (M2_HOME / M2_REPO)
#
# Used by build.gradle.kts to configure mavenLocal().
#
#   M2_HOME=D:/soft/maven        -> resolves to D:/soft/maven/repository
#   M2_REPO=D:/soft/mavenrepo   -> uses the path verbatim (takes precedence)
#
# If neither is set, defaults to ~/.m2/repository (standard Maven location).
# ---------------------------------------------------------------------------
# M2_HOME=
# M2_REPO=

# ---------------------------------------------------------------------------
# JDK used to run Gradle (org.gradle.java.home)
#
# Gradle resolves the JDK automatically via the following fallback chain:
#
#   1. Current project JDK
#      - In IntelliJ : the "Gradle JVM" / Project SDK configured for this project.
#      - On CLI      : the JDK used to launch the Gradle wrapper (gradlew).
#   2. Environment variable JDK
#      - The JAVA_HOME environment variable (used when launching Gradle).
#   3. System default JDK found on PATH.
#
# To pin a specific JDK *only on your machine*, either export JAVA_HOME or add an
# override in a local, non-committed gradle.properties (do NOT commit it), e.g.:
#     org.gradle.java.home=/path/to/your/jdk
#
# NOTE: Actual *compilation* uses the Kotlin JVM toolchain declared in
# build.gradle.kts (jvmToolchain(17)). Gradle auto-provisions (downloads) a
# matching JDK 17 when it is not already installed, so no manual JDK setup is
# required to build this project.
# ---------------------------------------------------------------------------